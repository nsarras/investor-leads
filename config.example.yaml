# Copy to config.yaml and edit. Every setting is optional; the values shown are the defaults.
# --industry, --stage, --days and --min-confidence on the command line override this file.

# One or more values each, comma-separated (a YAML list also works).
# An investor matches if they cover any one industry and any one stage.
industry: ""            # e.g. "gaming, entertainment"
stage: ""               # e.g. "pre-seed, seed"
days: 7                 # how far back to look

model: claude-haiku-5-5 # Anthropic model used to plan searches and classify posts
batch_size: 10          # posts per classification call
classify_workers: 4     # classification calls made at the same time
min_confidence: medium  # weakest leads to export: medium (default), medium-high, high, or low to add partial fits

data_dir: data          # local database of posts and classifications
output_dir: output      # where the CSV and Excel files are written

x:
  enabled: true
  max_queries: 12           # searches per run
  max_posts_per_query: 25   # X bills per post returned
  lang: en                  # "" for any language
  include_author_profile: true  # fetch the author's bio (billed as a user read)
  max_cost_usd: 5.0         # the run skips X if the worst-case estimate is higher
  exclude_terms: [airdrop, giveaway, presale, memecoin]   # spam filter added to every X search
  exclude_replies: true     # replies are mostly conversation, not announcements

linkedin:
  enabled: true
  actor_id: atomus/linkedin-post-search   # any Apify Actor that searches public posts
  max_keywords: 12
  max_posts_per_keyword: 25
  max_keywords_per_run: 20  # most keywords the Actor accepts per run; longer lists are split
  max_cost_usd: null        # most to spend on Apify per run of this tool, e.g. 3.0; null for no overall limit.
                            # Keywords that produced leads before are searched first, so the budget goes to those.
  max_charge_usd: 3.0       # Apify spending limit for each single Actor run; null to disable
  run_timeout_seconds: 900
  # To use a different Actor, change actor_id and describe its input and output here.
  # "$keywords" (list), "$max_posts" (number) and "$since_date" (YYYY-MM-DD) are filled in.
  input:
    search: $keywords
    maxPosts: $max_posts
    postedAfter: $since_date
  # our field: dotted path in the Actor's output items
  field_map:
    post_id: _metadata.post_id
    url: post_url
    text: content
    posted_at: posted_at
    author_name: author.name
    author_handle: author.username
    author_headline: author.headline
    author_url: author.linkedinUrl
    engagement: engagement.total_reactions
    matched_query: _metadata.search_term
  item_filter:
    type: post

# Used when a run is started with --email. The mail server settings go in .env.
email:
  to: []                    # e.g. [you@example.com, partner@example.com]
  max_leads_in_body: 10     # leads listed in the email text; the spreadsheet has all of them

# By default the model writes the searches from your industry and stage, and the plan is
# cached so later runs search the same way. To control the searches yourself, list them here.
x_queries: []
#  - '("seed round" OR "led by" OR "we invested") ("game studio" OR "gaming startup" OR esports)'
linkedin_keywords: []
#  - investing in gaming startups
