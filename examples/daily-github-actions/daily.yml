# Daily investor leads: search the last day, keep only what is new, email the spreadsheet.
#
# Put this file at .github/workflows/daily.yml in a PRIVATE repository, next to a config.yaml.
# Setup steps: https://github.com/nsarras/investor-leads/tree/main/examples/daily-github-actions

name: Daily investor leads

on:
  schedule:
    # 7:00 AM Pacific, every day. GitHub may start scheduled runs a few minutes late.
    - cron: "0 7 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch: # adds a "Run workflow" button, for testing

permissions:
  contents: read

concurrency:
  group: daily-investor-leads
  cancel-in-progress: false

env:
  # The repository to install the tool from, and the branch or tag to use.
  TOOL_REPO: nsarras/investor-leads
  TOOL_REF: main
  # Mail server. These two are not secret; change them if you do not use Gmail.
  SMTP_HOST: smtp.gmail.com
  SMTP_PORT: "587"

jobs:
  leads:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out this repository (for config.yaml)
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install investor-leads
        run: pip install "git+https://github.com/${TOOL_REPO}@${TOOL_REF}"

      # The database of posts already seen is what lets each run report only new leads.
      # A fresh copy is saved after every successful run and restored the next day.
      - name: Restore posts seen on earlier days
        uses: actions/cache@v5
        with:
          path: data
          key: leads-db-${{ github.run_id }}
          restore-keys: |
            leads-db-

      - name: Find new leads and email them
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }} # optional
          EMAIL_TO: ${{ secrets.EMAIL_TO }} # optional; overrides email.to in config.yaml
        run: investor-leads run --days 1 --only-new --email
