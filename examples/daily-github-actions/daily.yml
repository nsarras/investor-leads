# Daily investor leads: search the last day, keep only what is new, email the spreadsheet.
#
# Put this file at .github/workflows/daily.yml in a PRIVATE repository, next to a config.yaml.
# Setup steps: https://github.com/nsarras/investor-leads/tree/main/examples/daily-github-actions

name: Daily investor leads

on:
  schedule:
    # Main run: 6:37 AM Pacific, so the email lands around 7:00.
    # Not on the hour on purpose: GitHub delays, and sometimes drops, scheduled runs at busy
    # times, and the start of every hour is the busiest.
    - cron: "37 6 * * *"
      timezone: "America/Los_Angeles"
    # Backups, in case GitHub drops or badly delays the main run. A backup does nothing
    # (and sends nothing) when a run has already succeeded that day.
    - cron: "37 8 * * *"
      timezone: "America/Los_Angeles"
    - cron: "37 11 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch: # adds a "Run workflow" button; a manual run always goes ahead

permissions:
  contents: read

concurrency:
  group: daily-investor-leads
  cancel-in-progress: false

env:
  # The repository to install the tool from, and the branch or tag to use.
  TOOL_REPO: nsarras/investor-leads
  TOOL_REF: main
  # Mail server. These two are not secret; change them if you do not use Gmail.
  SMTP_HOST: smtp.gmail.com
  SMTP_PORT: "587"
  # The time zone that decides what counts as "today" for the once-a-day check.
  LOCAL_TZ: America/Los_Angeles

jobs:
  leads:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out this repository (for config.yaml)
        uses: actions/checkout@v7

      # The database of posts already seen is what lets each run report only new leads.
      # A fresh copy is saved after every successful run and restored the next time.
      - name: Restore posts seen on earlier days
        uses: actions/cache@v5
        with:
          path: data
          key: leads-db-${{ github.run_id }}
          restore-keys: |
            leads-db-

      - name: Has today's run already happened?
        id: today
        run: |
          today=$(TZ="$LOCAL_TZ" date +%F)
          last=$(cat data/last-successful-run 2>/dev/null || true)
          echo "Trigger: ${{ github.event_name }} ${{ github.event.schedule }}"
          echo "Today: $today. Last successful run: ${last:-never}."
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$last" = "$today" ]; then
            echo "Already done today, so this scheduled run stops here."
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.today.outputs.done != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install investor-leads
        if: steps.today.outputs.done != 'true'
        run: pip install "git+https://github.com/${TOOL_REPO}@${TOOL_REF}"

      - name: Find new leads and email them
        if: steps.today.outputs.done != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }} # optional
          EMAIL_TO: ${{ secrets.EMAIL_TO }} # optional; overrides email.to in config.yaml
        run: |
          investor-leads run --days 1 --only-new --email
          mkdir -p data
          TZ="$LOCAL_TZ" date +%F > data/last-successful-run
